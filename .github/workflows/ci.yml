name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: >-
          ruff format --check .
          --exclude app/dashboard/render.py
          --exclude scripts/update_bot_status.py
          --exclude app/ai/gemini.py
          --exclude app/api/dashboard.py
          --exclude app/live_paper/engine.py
          --exclude app/market_data/binance.py
          --exclude scripts/ai_shadow.py
          --exclude scripts/run_hourly_paper.py --exclude app/dashboard/render.py --exclude scripts/update_bot_status.py

      - name: Test suite
        run: pytest

name: Update Bot Status

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "BOT_STATUS.md"
      - "runtime/hourly_paper_state.json"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: write

concurrency:
  group: bot-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENABLE_AI_SHADOW: "true"
      AI_PROVIDER: "gemini"
      GEMINI_MODEL: "gemini-3.5-flash"
      TRADING_MODE: "paper"
      ENABLE_LIVE_TRADING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install .

      - name: Run hourly live-paper cycle
        run: python scripts/run_hourly_paper_cycle.py

      - name: Build BOT_STATUS from public market data
        run: python scripts/update_bot_status.py

      - name: Commit hourly state and BOT_STATUS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BOT_STATUS.md
          git add -f runtime/hourly_paper_state.json
          if git diff --cached --quiet; then
            echo "Status/state did not change."
          else
            git commit -m "Update hourly paper trading state"
            git push
          fi

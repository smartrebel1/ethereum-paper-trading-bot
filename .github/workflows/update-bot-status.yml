name: Hourly Paper Trading

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "BOT_STATUS.md"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: bot-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENABLE_AI_SHADOW: "true"
      AI_PROVIDER: "gemini"
      GEMINI_MODEL: "gemini-3.5-flash"
      TRADING_MODE: "paper"
      ENABLE_LIVE_TRADING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install .
      - name: Build status from Binance public market data
        run: python scripts/update_bot_status.py
      - name: Commit BOT_STATUS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BOT_STATUS.md
          if git diff --cached --quiet; then
            echo "Status did not change."
          else
            git commit -m "Update BOT_STATUS"
            git push
          fi

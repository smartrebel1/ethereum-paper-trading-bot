services:
  - type: web
    name: ethereum-paper-dashboard
    runtime: python
    plan: free
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethereum-paper-db
          property: connectionString
      - key: TRADING_MODE
        value: paper
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: ethereum-paper-scheduler
    runtime: python
    plan: free
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: python scripts/run_cloud_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethereum-paper-db
          property: connectionString
      - key: TRADING_MODE
        value: paper
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: ethereum-paper-db
    plan: free
